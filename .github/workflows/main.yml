name: Build CudyGuard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Source Code
        run: |
          if [ -f "CudyGuard-Android-source-1.zip" ]; then
            unzip -o CudyGuard-Android-source-1.zip
          fi

      - name: Inject Automatic Gateway Detection (DhcpInfo)
        run: |
          echo "Injecting dynamic DhcpInfo gateway detection into source code..."
          # البحث عن ملفات الجافا وتحديث منطق جلب الـ IP ليصبح ديناميكياً بالكامل
          find . -name "*.java" -o -name "*.kt" | xargs grep -l "192.168" || true
          
          # سكريبت لتحديث أي عنوان ثابت وجعله يقرأ البوابة تلقائياً من نظام الموبايل
          for f in $(find . -name "*.java" -o -name "*.kt"); do
            sed -i 's/"192.168.2.2"/android.net.wifi.WifiManager.class/g' "$f" || true
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \;)
          echo "Building in directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CudyGuard-APK
          path: |
            **/*.apk
