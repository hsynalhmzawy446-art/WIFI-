name: Build CudyGuard APK

'on':
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: |
          set -e
          mkdir -p source
          unzip -o CudyGuard-Android-source-1.zip -d source

      - name: Locate project
        id: project
        run: |
          set -e
          echo "Files found:"
          find source -maxdepth 5 -type f | head -200

          GRADLE_FILE=$(find source -type f -name gradlew | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "No gradlew found; checking for Gradle build files"
            find source -type f \( -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CudyGuard-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
