name: Build CudyGuard APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract source
        run: |
          mkdir -p source
          unzip -o CudyGuard-Android-source-1.zip -d source

      - name: Find and build APK
        run: |
          PROJECT_DIR=$(find source -type f -name gradlew -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found in source ZIP"
            unzip -l CudyGuard-Android-source-1.zip | head -n 100
            exit 1
          fi

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CudyGuard-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
